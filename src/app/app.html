<app-backdrop />
<app-theme-toggle />

<div class="layout">
  <app-sidebar [profile]="profile" [sections]="sections" />

  <main class="content">
    <app-section-block id="sobre-mi" index="01" heading="Sobre mí">
      <app-about [profile]="profile" [layers]="layers" />
    </app-section-block>

    <app-section-block id="experiencia" index="02" heading="Experiencia">
      <app-experience [jobs]="experience" />
    </app-section-block>

    <app-section-block id="proyectos" index="03" heading="Proyectos">
      <app-projects [projects]="projects" />
    </app-section-block>

    <app-section-block id="stack" index="04" heading="Stack">
      <app-stack [groups]="techGroups" />
    </app-section-block>

    <app-section-block id="contacto" index="05" heading="Contacto" class="last">
      <app-contact [profile]="profile" />
    </app-section-block>
  </main>
</div>
